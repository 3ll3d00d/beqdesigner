[project]
name = "beqdesigner"
version = "2.1.6"
description = "A Qt based app for designing BassEQ filters"
authors = [{ name = "3ll3d00d", email = "mattkhan+beqdesigner@gmail.com" }]
license = "MIT"
readme = "readme.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "pyqt6",
    "ffmpeg-python",
    "soundfile",
    "pyqtgraph",
    "pyyaml",
    "numpy",
    "scipy",
    "qtpy",
    "qtawesome",
    "sortedcontainers",
    "pillow",
    "requests",
    "awesomeversion",
    "markdown",
    "plumbum",
    "graphviz",
    "hamcws>=0.2.7,<0.3.0",
    "sanitize-filename",
    "matplotlib",
    "soxr",
]

[project.urls]
Homepage = "https://beqdesigner.readthedocs.io/"
Repository = "https://github.com/3ll3d00d/beqdesigner"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "distro",
    "atomicwrites",
    "scipy-stubs",
    "pytest-qt>=4.5.0",
    "httpx>=0.28.1",
    "openapi-spec-validator>=0.9.0",
    { include-group = "service" },   # the pipeline service's tests run with the rest
]
service = [   # the pipeline service (python -m pipeline.service; its Docker image): not in the desktop app
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false
