services:
  pipeline:
    image: ghcr.io/3ll3d00d/beqdesigner-pipeline:latest
    # Use a release tag instead of latest when you need a fixed version.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      BEQ_SERVICE_TOKEN_FILE: /run/secrets/service_token
      # TMDB_API_KEY_FILE: /run/secrets/tmdb_api_key
      # Git identity is needed only when allow_repository_writes is true.
      # GIT_AUTHOR_NAME: BEQDesigner
      # GIT_AUTHOR_EMAIL: beq@example.invalid
      # GIT_COMMITTER_NAME: BEQDesigner
      # GIT_COMMITTER_EMAIL: beq@example.invalid
    secrets:
      - service_token
    ports:
      - "127.0.0.1:8080:8080"  # put a TLS reverse proxy in front for remote access
    volumes:
      - ./config:/config:ro
      - ./work:/work
      - ./queue:/queue
      - /path/to/media:/media:ro  # match the paths named in profile.yaml
      # - /path/to/catalogue-repo:/catalogue  # only with repository writes enabled
      # - /path/to/xml-repo:/xml                # only with repository writes enabled
      # - ./ssh:/home/beq/.ssh:ro               # key and known_hosts, if pushing
    depends_on:
      - designer
    stop_grace_period: 120s
    restart: unless-stopped

  # The filter designer. The profile names it (see docs/library/service.md, "The designer"):
  #   designers: {beqforge: {url: 'http://designer:8420/design', by_reference: true}}
  #   run: {designer: beqforge, ...}
  # by_reference: the pipeline sends the extracted audio's file names, not the audio, so both containers mount the
  # same work directory: the designer reads it at /work, its shared root.
  designer:
    # Pin the version: a catalogue designed over several days should come from one designer build.
    image: ghcr.io/3ll3d00d/beqforge-designer:0.2.0
    user: "${PUID:-1000}:${PGID:-1000}"  # the same user as the pipeline: it must write the work directory and cache
    # environment:             # any `beqforge serve-designer` option, as BEQFORGE_<OPTION> (the beqforge README)
    #   BEQFORGE_RECORD_DIR: /records
    volumes:
      - ./work:/work
      - designer-cache:/cache   # the stage cache: a restart or a redesign does not repeat the analysis
      # - ./records:/records
    expose:
      - "8420"                  # reachable from the pipeline only; publish it to call it from elsewhere
    restart: unless-stopped

volumes:
  designer-cache:

secrets:
  service_token:
    file: ./config/service-token
