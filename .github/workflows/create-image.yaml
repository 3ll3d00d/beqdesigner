name: publish pipeline image
on:
  push:
    tags:
      - '*'
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # the arm64 image builds under emulation
    steps:
      - uses: actions/checkout@v7
      - name: Set image version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$version" > src/main/python/VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build image for smoke test
        run: |
          docker build -f docker/Dockerfile -t beqdesigner-pipeline:smoke \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            --build-arg REVISION="${{ steps.version.outputs.revision }}" .
      - name: Extract, design and check the review queue
        run: python3 docker/smoke.py beqdesigner-pipeline:smoke
      - name: Design by reference through the designer the compose example pins
        run: |
          designer="$(grep -oE 'ghcr.io/3ll3d00d/beqforge-designer:[^[:space:]]+' docker/compose.example.yaml)"
          docker pull "$designer"
          python3 docker/smoke.py beqdesigner-pipeline:smoke --designer-image "$designer"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose tags
        id: tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-pipeline"
          tags="$image:$GITHUB_REF_NAME"
          if [[ ! "$GITHUB_REF_NAME" =~ -(alpha|beta|rc)([.-]|$) ]]; then
            tags="$tags,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.version.outputs.revision }}
